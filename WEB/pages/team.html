<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <h1>Table element</h1>
    <table>
        <caption>Weekly Class Timetable</caption>
        <thead>
            <tr>
                <th>Day</th>
                <th>Subject</th>
                <th>Time</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Monday</td>
                <td>Web Design</td>
                <td>9:00 AM</td>
            </tr>
            <tr>
                <td rowspan="2">Tuesday</td>
                <td>Mathematics</td>
                <td>11:00 AM</td>
            </tr>
            <tr>
                <td colspan="2">Friday: No Classes (Public Holiday)</td>
            </tr>
        </tbody>
    </table>
    <div >
        <p>first</p>
        <p>second</p>
        <p>third</p>
    </div>
    <span>first</span>
    <span>second</span>
    <span>third</span>
    <strong>first</strong>
    <strong>second</strong>
    <strong>third</strong>
    <em>first</em>
    <em>second</em>
    <em>third</em>

</body>
