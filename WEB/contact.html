<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - IPLE</title>
    <!-- <link rel="stylesheet" href="css/style.css"> -->
</head>

<body>

    <header>
        <h1>Contact Us</h1>
    </header>

    <main>
        <section>
            <h2>Send Us a Message</h2>
            <form action="success_get.html" method="get">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section>
            <h2>Find Us</h2>
            <iframe src="https://maps.example.com/embed?q=Kampala" width="100%" height="300"
                title="Map showing our office location" loading="lazy">
            </iframe>
        </section>

        <section>
            <h2>Welcome Video</h2>
            <video controls width="480" poster="images/preview.jpg">
                <source src="welcome.mp4" type="video/mp4">
                <track src="captions-en.vtt" kind="captions" srclang="en" label="English" default>
                Your browser does not support the video tag.
            </video>
        </section>

        <details>
            <summary>Office Hours</summary>
            <p>We are open Monday to Friday, 8:00 AM to 5:00 PM.</p>
        </details>
    </main>

    <footer>
        <p>&copy; 2026 IPLE. All rights reserved.</p>
    </footer>

</body>

</html>
